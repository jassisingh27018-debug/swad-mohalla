<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Swad Mohalla</title>

<style>
:root{--bg:#fff6e6;--card:#fff;--ink:#2a1c10;--mut:#7a6552;--pri:#d9480f;--pri2:#fde3c4;--ok:#2e8b4a;--bad:#c8372d;--warn:#b7791f;--ln:#e8d5b5;--mp:#f7ecd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17110b;--card:#241b12;--ink:#f4e9d8;--mut:#c4a995;--pri:#f76707;--pri2:#3b2314;--ok:#4cb36b;--bad:#e5594f;--warn:#e0a63a;--ln:#4a3a28;--mp:#2c2116;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'Noto Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100%}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;text-decoration:none}
#app{max-width:480px;margin:0 auto;padding:0 14px 110px}
.top{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}
.h{font-size:22px;font-weight:700}.b{font-weight:700}.mut{font-size:14px;color:var(--mut)}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:13px;margin:10px 0;display:block;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;padding:8px 16px;border-radius:14px;font-weight:800;background:var(--pri);color:#fff;text-align:center;margin:6px 0}
.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.l{background:var(--card);color:var(--ink);border:2px solid var(--ln)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{padding:6px 14px;border-radius:99px;border:2px solid var(--ln);background:var(--card);font-weight:600;white-space:nowrap;min-height:42px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
input,select{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:3px 0}
label{display:block;font-weight:600;font-size:15px;margin-top:8px}
.dp-methods label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;margin:0;min-height:28px}.dp-methods input[type=checkbox]{width:16px;height:16px;min-height:16px;flex:0 0 16px;padding:0;margin:0;accent-color:var(--pri)}
.ph{width:56px;height:56px;border-radius:16px;background:var(--pri2);display:grid;place-items:center;font-size:30px;flex:none}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:800;background:var(--pri2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.sq{width:46px;height:46px;border-radius:12px;background:var(--pri2);font-size:22px;font-weight:800;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;text-align:center;padding:6px 2px;font-size:12px;font-weight:600;min-height:58px;color:var(--mut)}nav button span{display:block;font-size:22px}nav button.on{color:var(--pri);font-weight:800}
.role{display:flex;gap:14px;align-items:center;width:100%;color:#fff;border-radius:20px;padding:18px;margin-top:12px;min-height:100px}
.role .ic{font-size:42px}
.steps{display:flex;gap:3px;margin:10px 0}.stp{flex:1;text-align:center;font-size:11px;line-height:1.1;opacity:.4}.stp i{display:grid;place-items:center;margin:0 auto 3px;width:34px;height:34px;border-radius:50%;background:var(--ln);font-style:normal}.stp.on{opacity:1}.stp.on i{background:var(--ok);color:#fff}
.otp{font-size:32px;letter-spacing:8px;font-weight:800;text-align:center;background:var(--pri2);border-radius:12px}
.map{width:100%;height:auto;border-radius:14px;border:2px solid var(--ln);display:block}.map text{font-family:inherit}.map g{cursor:pointer}

.bill{border:2px dashed var(--ink)}.bill hr{border:0;border-top:1px dashed var(--ln);margin:8px 0}
.star{font-size:30px;min-width:44px;min-height:44px;text-align:center}
textarea{width:100%;padding:8px 12px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:3px 0;resize:vertical}
.modal{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--card);max-width:480px;width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(217,72,15,.75);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(217,72,15,0);transform:scale(1.04)}}
.flash{animation:flash 1.2s infinite}@media(prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--pri)}}
.fab{position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--pri);color:#fff;border-radius:99px;padding:10px 16px;min-height:48px;font-weight:800}
details.card>summary{cursor:pointer;font-weight:700}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:20;pointer-events:none}#toast div{display:inline-block;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:800;margin:2px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--ln)}.msg.u{background:var(--pri);color:#fff;margin-left:auto}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media print{body *{visibility:hidden}#bill,#bill *{visibility:visible}#bill{position:absolute;left:0;top:0;width:100%}}
</style></head><body><div id="app"></div><div id="toast"></div>

function tv(){const m=S.orders.filter(o=>o.mine).reverse();if(!m.length)return '<div class="card mut" style="text-align:center">📦 No orders yet. Your food, bill and rating will show here.</div>'+B('tab|h','🔍','Find food');
